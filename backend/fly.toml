app = 'backend-sunlit-sunrise-8807'
primary_region = 'cdg'

[build]

[[mounts]]
  source = 'data'
  destination = '/app/data'

[http_service]
  internal_port = 8000          # ✅ المنفذ الصحيح
  force_https = true
  # Keep the machine warm so the SQLite volume is always mounted and
  # registered users / uploaded files never get lost.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
