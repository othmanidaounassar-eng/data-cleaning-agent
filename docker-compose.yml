version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oqzaro-analysis-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost,http://localhost:3000,http://localhost:80,https://${SITE_DOMAIN}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - GROQ_MAX_TOKENS=${GROQ_MAX_TOKENS:-700}
      - GROQ_DISABLED=${GROQ_DISABLED:-0}
      - SECRET_KEY=${SECRET_KEY}
      - MAX_ROWS=${MAX_ROWS:-1000000}
      - MAX_COLUMNS=${MAX_COLUMNS:-500}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-100}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-10080}
      - OQZARO_DB_PATH=/app/data/oqzaro.db
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - oqzaro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oqzaro-analysis-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api
    depends_on:
      - backend
    networks:
      - oqzaro

  nginx:
    image: nginx:1.25-alpine
    container_name: oqzaro-analysis-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - frontend
      - backend
    networks:
      - oqzaro

volumes:
  backend_data:
  backend_uploads:
  nginx_certs:

networks:
  oqzaro:
    driver: bridge
